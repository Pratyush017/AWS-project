version: 1
applications:
  - appRoot: civic-guard
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - env | grep -E '^(NEXT_PUBLIC_|APP_AWS_|AWS_|GEMINI_|GROQ_)' > .env.production || true
            - npm ci
            - find .. . -type d \( -name "win32" -o -name "darwin" \) -path "*/onnxruntime-node/*" -exec rm -rf {} + 2>/dev/null || true
        build:
          commands:
            - env | grep -E '^(NEXT_PUBLIC_|APP_AWS_|AWS_|GEMINI_|GROQ_)' > .env.production || true
            - find .. . -type d \( -name "win32" -o -name "darwin" \) -path "*/onnxruntime-node/*" -exec rm -rf {} + 2>/dev/null || true
            - npm run build
        postBuild:
          commands:
            - rm -rf .next/cache || true
            - rm -rf .next/standalone || true
            - find .. . -type d \( -name "win32" -o -name "darwin" \) -path "*/onnxruntime-node/*" -exec rm -rf {} + 2>/dev/null || true
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
