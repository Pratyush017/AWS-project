version: 1
applications:
  - appRoot: civic-guard
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - env | grep -E '^(NEXT_PUBLIC_|APP_AWS_|AWS_|GEMINI_|GROQ_)' > .env.production || true
            - npm ci
        build:
          commands:
            - env | grep -E '^(NEXT_PUBLIC_|APP_AWS_|AWS_|GEMINI_|GROQ_)' > .env.production || true
            - npm run build
            - rm -rf .next/cache
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
